# Publishes to npm with trusted publishing when a GitHub release is published.
# Before the first run: add "repository" to package.json and set up the trusted
# publisher on npmjs.com. The first publish may have to be done by hand.
name: Publish
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish
